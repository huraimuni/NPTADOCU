<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나인페이먼츠 서류 제출</title>
<style>
  :root {
    --blue: #3182F6;
    --blue-dark: #1B64DA;
    --navy: #1A2744;
    --gray: #8B95A1;
    --border: #E5E8EB;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #FFFFFF;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px 80px;
    color: #191F28;
  }
  .wrap { width: 100%; max-width: 520px; }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 40px;
    font-weight: 800;
    font-size: 19px;
    color: var(--navy);
  }
  .brand .dot {
    width: 28px; height: 28px;
    border-radius: 9px;
    background: var(--blue);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    flex-shrink: 0;
  }
  .brand .dot svg { width: 16px; height: 16px; }

  .heading { text-align: center; margin-bottom: 32px; }
  .heading .eyebrow {
    font-size: 14px;
    color: var(--blue-dark);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .heading h1 {
    font-size: 22px;
    font-weight: 800;
    color: #191F28;
    line-height: 1.4;
  }

  .card {
    background: white;
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 8px 30px rgba(20, 40, 90, 0.08);
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--navy);
    margin-bottom: 16px;
  }

  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #4E5968;
    margin-bottom: 6px;
  }
  .field label .opt { color: var(--gray); font-weight: 500; }
  input[type="text"], input[type="tel"], input[type="email"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 15px;
    font-family: inherit;
    background: #F9FAFB;
    color: #191F28;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input::placeholder { color: #B0B8C1; }
  input:focus { border-color: var(--blue); background: white; }

  .doc-slot {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .doc-slot:last-child { margin-bottom: 0; }
  .doc-slot-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .doc-slot-title {
    font-size: 13.5px;
    font-weight: 700;
    color: #191F28;
  }
  .doc-slot-title .idx {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #EAF2FF;
    color: var(--blue-dark);
    font-size: 10.5px;
    font-weight: 700;
    margin-right: 6px;
  }
  .doc-slot-badge {
    font-size: 11px;
    color: var(--gray);
    font-weight: 600;
  }
  .doc-slot-hint {
    font-size: 11.5px;
    color: var(--gray);
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .doc-slot-body {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .doc-upload-btn {
    flex-shrink: 0;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid var(--blue);
    background: #F5F9FF;
    color: var(--blue-dark);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .doc-upload-btn:hover { background: #EAF2FF; }
  .doc-file-info {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .doc-thumb {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: #F9FAFB;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .doc-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .doc-file-name {
    font-size: 12.5px;
    color: #191F28;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .doc-file-status {
    font-size: 11px;
    color: var(--gray);
    flex-shrink: 0;
  }
  .doc-remove {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
    padding: 2px;
  }
  .doc-placeholder {
    font-size: 12.5px;
    color: #B0B8C1;
  }

  .doc-placeholder-card {
    text-align: center;
    font-size: 13px;
    color: var(--gray);
    padding: 20px 0;
  }

  .biz-type-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .biz-type-btn {
    text-align: center;
    padding: 14px 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #F9FAFB;
    font-size: 13.5px;
    font-weight: 600;
    color: #4E5968;
    cursor: pointer;
    user-select: none;
    transition: all 0.12s ease;
    line-height: 1.4;
  }
  .biz-type-btn:hover { border-color: #C7D3E0; }
  .biz-type-btn.selected {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }
  .biz-type-btn .sub { display: block; font-size: 11px; font-weight: 500; opacity: 0.8; margin-top: 2px; }

  .consent-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 4px 2px;
    font-size: 13px;
    line-height: 1.5;
    cursor: pointer;
    color: #4E5968;
  }
  .consent-row .check {
    width: 18px; height: 18px;
    border-radius: 5px;
    border: 1.5px solid #D1D6DB;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    color: white;
    transition: all 0.12s ease;
    margin-top: 1px;
  }
  .consent-row.checked .check { background: var(--blue); border-color: var(--blue); }
  .consent-row .label-required { color: var(--blue); font-weight: 700; margin-right: 4px; }

  .submit-btn {
    width: 100%;
    margin-top: 4px;
    padding: 16px 0;
    border: none;
    border-radius: 14px;
    background: var(--blue);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .submit-btn:hover { background: var(--blue-dark); }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn:disabled { background: #B0B8C1; cursor: not-allowed; }

  .foot-note {
    text-align: center;
    font-size: 12.5px;
    color: var(--gray);
    margin-top: 16px;
    line-height: 1.6;
  }

  .success {
    display: none;
    text-align: center;
    padding: 40px 12px 8px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(20, 40, 90, 0.08);
  }
  .success .icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: #E8F3FF;
    color: var(--blue);
    font-size: 30px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .success h2 { font-size: 19px; margin-bottom: 8px; color: #191F28; }
  .success p { font-size: 14px; color: var(--gray); line-height: 1.6; }

  @media (max-width: 380px) {
    .card { padding: 20px 16px; }
    .heading h1 { font-size: 19px; }
    .doc-slot-body { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAL8AAAAgCAMAAAB0BFmiAAAAflBMVEWWn6wccecyRmIti+RSmOSryedNXnRkc4iJuOgAFzzEyc98h5j+/v4QiesNJ0sEZ+7S5PEYkfB0t+kvleXl6u+RxuwDHUKz1u9SpubM3e1vqeglOVcZMVPP09gTc+q0u8MAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA3aU+8AAAAIHRSTlP//////////////////////////////////////////3Fe9GAAAASySURBVHja7Zhbm6MgDIY91zqCyEHEWv3//3KTAB6m7ezczD7bfTYXLanYvoTkIzZp39uS//x/I79Ikvsb8+vser3d34S/SZLERX8FR7cJ5/PwzdQyxehNGvtznMI594K/uvIh08G/Xfk1QX58+5bJhW02ip/iL7olFS/4B86HS+QH8rVtL5xX+pv87GDqp7Yg7brOvebnPNn4hxUrQH/3m5FfFUUxFrSAH+LPgV98xY9R3/nvzb2BRTRNqds7lMS63YDeSZsk65mkUalgAbQB1hhT0s85IeLP0si/GGNFmGd3Krwr7J+wmO7C1LX12Y/xL4WjqLqyrmv/9Qf+TOz8LuMc9CcZoIoTTCleNTTdXcibq/UJP20FDO3oc2kSrct7Nu7zrGGKSYnrVCbMg4HXAcV2d+qWzsgOrRA++mBLN8Faii4lZxInfl498H/AlZu/yElO71nw+Jw84TfEvxcE/PSI1HRRYXIZ1veqR2M9LQMG/vq43TURP9J6y332o6VFq/ODs/HPPNTwp/h7dOTFqzqDibfLJdvzbQv6PswZy0cJPLguy8IGWHKRv2dKETig44Cu06LpLsZqz78toT7Gvwb8pZiKtFvcxn9NaBOSZ/zVKkoEBomFfOIV7Rr6D/wCA2paMZKMIrDCsPdKhG0SxM+kEH4dMMCP4bqN2mVxm4TnL5wuMdgQdEH5r+GLALzDiXoq2wO/oCA3j/wz5k3JaQCfzl7EQF95s/OPUHnGp/VejgURI6DBtVGcgZvlPl3CvhSUYJJWHnPQUP6npAk+gSiD6KuRvxafzq9wZPEMwYFfbPXrq0LjBtzvmEsXsmpX3JP+ewhby2kaFZEdwEv/JmPVmLgQS9k/SrSRKmDytQqCgYmuD/o/pZT6Re3aY/x9TvDqduT/AP7Lzr/ijGEI5T4840ckm0ePShcAewthpqPhkX+iWeoUhHHnF8snfpFS/aaYVif+TYdO+vnAP5NhxR/5czClJO6rI19RjSI/Fa4N3F/y52QsP8b/gR/0M33QH+LX2W/4KX+ScgUrm3UVh/yH9kocfJLmKJ0K9SiMX/Fj1hgHh5Z1wlnxFT/QuHoiRXIn/vZ+i/xP86fB+g1RF82pf5CH8xhQchEEn5il18qxfclfhpPDn+Lx/HrB72JDB4J05vclEOM/f45/4/X04651kvHkC34io7xCfuHPK/MVP0nv6PDsXuQzfoz3BH0E5H+OK9T5gX+OvfJH6ITEE34Q11Ait/nF+UVW+5PIV2Q4Wvs+COsrftoARgcbW2rPL4/8ky/aggYgP+Qe9dMbAl6B/zYgL/QPwzH+rb7E/oFf9KH/P/JHLVF7N4f8Y/uKnyG/X3bsOlAlUx//oJ/OH8WLKLpoi/X8lznbuhlR3bJb2Wp4yyD+4Hh+9CnlkwqDP2f7w43JVV6fHpWmnE7TEkQotj4UY2pRlap9t6YUfSRVmGVH0l0lMTD1kqc0T+RpWuAnJSbMApJT+xUshQv6qfWx2feOPr2d5kADvf7m0VhYe3qOGb/3XCBsad0Jg0bxsitDzwzz4vCP/H9i9g71/f7/kdTu5+JN+TU1+T8W/j/DHx/B3jF/TKFG8///z3+V/xfHtzvW1q62cQAAAABJRU5ErkJggg==" alt="나인페이먼츠" style="height:28px;width:auto;flex-shrink:0;"></div>

  <div class="heading">
    <div class="eyebrow">프로모션 진행을 위한 서류 제출</div>
    <h1>기본정보와 서류를 올려주세요</h1>
  </div>

  <form id="docForm">

    <div class="card">
      <div class="card-title">사업자 유형</div>
      <div class="biz-type-grid" id="bizTypeGrid">
        <div class="biz-type-btn" data-value="new_individual">신규사업자<span class="sub">(개인)</span></div>
        <div class="biz-type-btn" data-value="new_corp">신규사업자<span class="sub">(법인)</span></div>
        <div class="biz-type-btn" data-value="existing_individual">기존사업자<span class="sub">(개인)</span></div>
        <div class="biz-type-btn" data-value="existing_corp">기존사업자<span class="sub">(법인)</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">기본정보</div>
      <div class="field">
        <label>상호</label>
        <input type="text" id="shopName" placeholder="상호명을 입력해주세요" required>
      </div>
      <div class="field">
        <label>대표자 성함</label>
        <input type="text" id="repName" placeholder="대표자 성함을 입력해주세요" required>
      </div>
      <div class="field">
        <label>일반전화 <span class="opt">(선택)</span></label>
        <input type="tel" id="landline" placeholder="예) 062-000-0000" inputmode="numeric">
      </div>
      <div class="field">
        <label>핸드폰번호</label>
        <input type="tel" id="mobile" placeholder="예) 010-0000-0000" required inputmode="numeric">
      </div>
      <div class="field">
        <label>이메일 <span class="opt">(선택)</span></label>
        <input type="email" id="email" placeholder="example@email.com">
      </div>
    </div>

    <div class="card">
      <div class="card-title">필요 서류</div>
      <div id="docSlots"></div>
    </div>

    <div class="card">
      <div class="consent-row checked" id="requiredConsent">
        <div class="check">✓</div>
        <div><span class="label-required">필수</span>제출한 서류는 카드사·밴(VAN)사 가맹점 심사 및 상담·프로모션 진행 목적으로 사용되며, 처리 완료 후 파기됩니다</div>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">서류 제출하기</button>
    <div class="foot-note">제출하신 서류는 담당자만 확인하며,<br>외부에 공유되지 않습니다.</div>
  </form>

  <div class="success" id="successView">
    <div class="icon">✓</div>
    <h2>서류가 제출되었습니다</h2>
    <p>확인 후 담당자가 안내드릴게요.<br>감사합니다!</p>
  </div>

</div>

<script>
  // ⚠️ 구글 앱스스크립트 배포 후 받은 웹앱 URL로 바꿔주세요. (상담신청 페이지와 동일한 URL 사용 가능)
  const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxQgBxtt16oQivVMP9yASEiOeesXiBxCFFj35o2kAddueV8uHjjP5yOLfYLXFaugCDYPQ/exec";

  // 신규사업자(개인·법인 공통) 기본 서류
  const NEW_COMMON = [
    { id: "bizReg",       label: "사업자등록증 사본(원본 촬영) 1부", shortName: "사업자등록증", required: true, hint: "사본·스캔본이 아닌, 원본을 직접 촬영한 사진이어야 합니다." },
    { id: "idCard",       label: "대표자 신분증 사본 (주민등록증 또는 운전면허증)", shortName: "신분증", required: true, hint: "주민등록번호 뒷자리를 가리지 말고 전체가 보이도록 촬영해주세요." },
    { id: "coRepIdCard",  label: "공동대표 신분증 사본", shortName: "공동대표신분증", opt: "(공동대표인 경우만)", required: false, hint: "주민등록번호 뒷자리를 가리지 말고 전체가 보이도록 촬영해주세요." },
    { id: "bankBook",     label: "정산 입금 통장 사본 (사업자 또는 대표자 명의)", shortName: "통장사본", required: true },
    { id: "interior1",    label: "매장 내부 사진 1 (업종 관련)", shortName: "매장내부사진1", required: true, hint: "업종을 확인할 수 있도록 관련 기구·집기가 함께 보이게 촬영해주세요. (예: 식당은 테이블, 카페는 주방·바 기기 등)" },
    { id: "interior2",    label: "매장 내부 사진 2 (업종 관련)", shortName: "매장내부사진2", required: true, hint: "1번 사진과 다른 각도 또는 다른 구역으로 촬영해주세요." },
    { id: "signage",      label: "매장 외부 전경 및 간판 사진", shortName: "매장간판사진", required: true },
    { id: "roadSign",     label: "도로명주소표지판 사진", shortName: "도로명표지판", required: true },
    { id: "license",      label: "업종별 인·허가증 (영업신고증 등)", shortName: "업종인허가증", opt: "(해당 업종만)", required: false },
  ];
  // 신규사업자(법인) 추가 서류
  const NEW_CORP_EXTRA = [
    { id: "corpReg",          label: "법인 등기부등본", shortName: "법인등기부등본", opt: "(최근 3개월 이내)", required: true },
    { id: "corpSeal",         label: "법인 인감증명서", shortName: "법인인감증명서", opt: "(최근 3개월 이내)", required: true },
    { id: "shareholderList",  label: "주주명부", shortName: "주주명부", opt: "(최근 3개월 이내, 인감 날인)", required: true },
    { id: "sealUsage",        label: "사용인감계", shortName: "사용인감계", opt: "(사용인감 사용 시만)", required: false },
    { id: "ownerConfirm",     label: "법인소유지배자확인서", shortName: "법인소유지배자확인서", required: true },
    { id: "corpCustomerConfirm", label: "법인용고객거래확인서", shortName: "법인용고객거래확인서", required: true },
  ];
  // 기존사업자(개인·법인 공통) 서류 — 토스페이 청약용
  const EXISTING_COMMON = [
    { id: "bizReg",   label: "사업자등록증 사본(원본 촬영)", shortName: "사업자등록증", required: true, hint: "사본·스캔본이 아닌, 원본을 직접 촬영한 사진이어야 합니다." },
    { id: "idCard",   label: "대표자 신분증 사본", shortName: "신분증", opt: "(미첨부 시 휴대폰 인증으로 대체 가능)", required: false, hint: "주민등록번호 뒷자리를 가리지 말고 전체가 보이도록 촬영해주세요." },
    { id: "bankBook", label: "정산 통장 사진", shortName: "통장사본", required: true },
  ];

  const TYPE_SLOTS = {
    new_individual: NEW_COMMON,
    new_corp: NEW_COMMON.concat(NEW_CORP_EXTRA),
    existing_individual: EXISTING_COMMON,
    existing_corp: EXISTING_COMMON,
  };
  const BIZ_TYPE_LABELS = {
    new_individual: "신규사업자(개인)",
    new_corp: "신규사업자(법인)",
    existing_individual: "기존사업자(개인)",
    existing_corp: "기존사업자(법인)",
  };

  let DOC_SLOTS = [];
  let selectedBizType = "";
  const docState = {}; // id -> { file, base64, mimeType, name, status, previewUrl }
  const docSlotsEl = document.getElementById("docSlots");

  function showBizTypePlaceholder() {
    docSlotsEl.innerHTML = '<div class="doc-placeholder-card">먼저 위에서 사업자 유형을 선택해주세요</div>';
  }
  showBizTypePlaceholder();

  document.querySelectorAll(".biz-type-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".biz-type-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedBizType = btn.dataset.value;
      buildDocSlots(selectedBizType);
    });
  });

  function buildDocSlots(type) {
    // 유형이 바뀌면 이전에 첨부한 파일 상태는 초기화됩니다
    Object.keys(docState).forEach(k => delete docState[k]);
    DOC_SLOTS = TYPE_SLOTS[type] || [];
    docSlotsEl.innerHTML = "";

    DOC_SLOTS.forEach((slot, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "doc-slot";

      const head = document.createElement("div");
      head.className = "doc-slot-head";
      const title = document.createElement("div");
      title.className = "doc-slot-title";
      title.innerHTML = '<span class="idx">' + (idx + 1) + '</span>' + slot.label;
      head.appendChild(title);
      if (!slot.required) {
        const badge = document.createElement("div");
        badge.className = "doc-slot-badge";
        badge.textContent = slot.opt || "선택";
        head.appendChild(badge);
      }
      wrap.appendChild(head);

      if (slot.hint) {
        const hint = document.createElement("div");
        hint.className = "doc-slot-hint";
        hint.textContent = slot.hint;
        wrap.appendChild(hint);
      }

      const body = document.createElement("div");
      body.className = "doc-slot-body";
      body.id = "body_" + slot.id;
      renderSlotBody(slot, body);
      wrap.appendChild(body);

      docSlotsEl.appendChild(wrap);

      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/png,image/jpeg,image/jpg,application/pdf";
      input.style.display = "none";
      input.id = "input_" + slot.id;
      input.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) handleSlotFile(slot, file);
        input.value = "";
      });
      wrap.appendChild(input);
    });
  }

  function renderSlotBody(slot, body) {
    body.innerHTML = "";
    const state = docState[slot.id];

    if (!state) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "doc-upload-btn";
      btn.textContent = "사진 선택";
      btn.onclick = () => document.getElementById("input_" + slot.id).click();
      body.appendChild(btn);

      const ph = document.createElement("div");
      ph.className = "doc-placeholder";
      ph.textContent = "선택된 파일 없음";
      body.appendChild(ph);
      return;
    }

    const info = document.createElement("div");
    info.className = "doc-file-info";

    const thumb = document.createElement("div");
    thumb.className = "doc-thumb";
    if (state.previewUrl) {
      const img = document.createElement("img");
      img.src = state.previewUrl;
      thumb.appendChild(img);
    } else {
      thumb.textContent = "📄";
    }
    info.appendChild(thumb);

    const name = document.createElement("div");
    name.className = "doc-file-name";
    name.textContent = state.name;
    info.appendChild(name);

    const status = document.createElement("div");
    status.className = "doc-file-status";
    status.textContent = state.status;
    info.appendChild(status);

    body.appendChild(info);

    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "doc-remove";
    removeBtn.textContent = "✕";
    removeBtn.onclick = () => {
      delete docState[slot.id];
      renderSlotBody(slot, body);
    };
    body.appendChild(removeBtn);
  }

  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function fileToBase64Raw(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleSlotFile(slot, file) {
    const body = document.getElementById("body_" + slot.id);
    docState[slot.id] = { file, name: file.name, mimeType: file.type, status: "처리 중", previewUrl: null, base64: null };
    renderSlotBody(slot, body);

    try {
      let dataUrl, mimeType;
      if (file.type && file.type.startsWith("image/")) {
        dataUrl = await compressImage(file, 1920, 0.85);
        mimeType = "image/jpeg";
      } else {
        dataUrl = await fileToBase64Raw(file);
        mimeType = file.type || "application/octet-stream";
      }
      docState[slot.id].base64 = dataUrl.split(",")[1];
      docState[slot.id].mimeType = mimeType;
      docState[slot.id].previewUrl = mimeType.startsWith("image/") ? dataUrl : null;
      docState[slot.id].status = "준비 완료";
    } catch (err) {
      docState[slot.id].status = "오류";
    }
    renderSlotBody(slot, body);
  }

  const requiredRow = document.getElementById("requiredConsent");
  let requiredChecked = true;
  requiredRow.addEventListener("click", () => {
    requiredChecked = !requiredChecked;
    requiredRow.classList.toggle("checked", requiredChecked);
  });

  document.getElementById("docForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    if (!requiredChecked) {
      alert("필수 동의가 필요합니다.");
      return;
    }

    if (!selectedBizType) {
      alert("사업자 유형을 먼저 선택해주세요.");
      return;
    }

    const shopName = document.getElementById("shopName").value.trim();
    const repName = document.getElementById("repName").value.trim();
    const landline = document.getElementById("landline").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const email = document.getElementById("email").value.trim();

    if (!shopName || !repName || !mobile) {
      alert("필수 항목(상호, 대표자 성함, 핸드폰번호)을 모두 입력해주세요.");
      return;
    }

    // 서류 첨부는 필수가 아닙니다 — 빠뜨려도 제출 가능
    const notReady = DOC_SLOTS.filter(s => docState[s.id] && docState[s.id].status !== "준비 완료");
    if (notReady.length > 0) {
      alert("파일 처리가 아직 끝나지 않았어요. 잠시만 기다려주세요.");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "제출 중...";

    const files = DOC_SLOTS
      .filter(s => docState[s.id])
      .map(s => ({
        label: s.label,
        shortName: s.shortName,
        name: docState[s.id].name,
        mimeType: docState[s.id].mimeType,
        base64: docState[s.id].base64,
      }));

    const payload = {
      formType: "docUpload",
      bizCategory: BIZ_TYPE_LABELS[selectedBizType] || selectedBizType,
      shopName: shopName,
      repName: repName,
      landline: landline,
      mobile: mobile,
      email: email,
      submittedAt: new Date().toLocaleString("ko-KR"),
      files: files,
    };

    fetch(GAS_WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    })
      .then(() => {
        document.getElementById("docForm").style.display = "none";
        document.getElementById("successView").style.display = "block";
      })
      .catch(() => {
        alert("제출 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
        btn.disabled = false;
        btn.textContent = "서류 제출하기";
      });
  });
</script>
</body>
</html>
